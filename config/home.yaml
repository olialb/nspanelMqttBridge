        type: input_sel
        item: NsPanels_STRNG_AlarmMode
        #options: mode1="Vollschutz",mode2="Zuhause",mode3="Nacht",mode4="Besuch"
      - class: ohItem
        type: text
        item: NsPanels_STRNG_AlarmIcon
        icon: "\ue482"
        iconColor: "red"
      - class: ohItem
        type: switch
        item: NsPanels_SW_AlarmKeypadEnable
      - class: ohItem
        type: switch
        item: Switch_Kugellampe
        icon: "\ue482"
        iconColor: "red"
  - name: Thermo
    title: Schafzimmerthermostat
    type: cardThermo
    slots:
      - class: ohItem
        type: number
        item: H_Schlafzimmer_SetHeatTemp
      - class:
      - class: ohItem
        type: text
        item: H_Schlafzimmer_Temperatur
      - class: ohItem
        type: text
        item: H_Schlafzimmer_OpMode
      - class: ohItem
        type: text
        item: H_Schlafzimmer_SysMode
      - class: ohItem
        type: text
        item: H_Schlafzimmer_RunState
      - class: ohItem
        type: switch
        item: H_Schlafzimmer_Lock
        iconColor: "yellow"
        icon: "\uE305"
      - class: ohItem
        type: switch
        item: H_Schlafzimmer_boost
        iconColor: "red"
        icon: "\uFA44"
      - class: ohItem
        type: switch
        item: H_Schlafzimmer_windowOpen
        iconColor: "yellow"
        icon: "\uF1DB"
  - name: ThermoExt
    title: Schafzimmerthermostat
    type: cardThermo
    min: 5.0
    max: 30.0
    steps: 0.5
    details: True
    slots:
      - class: ohItem
        type: number
        item: H_Schlafzimmer_SetHeatTemp
      - class: ohItem
        type: number
        item: H_Schlafzimmer_SetCoolTemp
      - class: ohItem
        type: text
        item: H_Schlafzimmer_Temperatur
      - class: ohItem
        type: input_sel
        item: H_Schlafzimmer_OpMode
      - class: ohItem
        type: input_sel
        item: H_Schlafzimmer_SysMode
      - class: ohItem
        type: input_sel
        item: H_Schlafzimmer_RunState
      - class: ohItem
        type: switch
        item: H_Schlafzimmer_Lock
        iconColor: "yellow"
        icon: "\uE305"
      - class: ohItem
        type: switch
        item: H_Schlafzimmer_boost
        iconColor: "red"
        icon: "\uFA44"
      - class: ohItem
        type: switch
        item: H_Schlafzimmer_windowOpen
        iconColor: "yellow"
        icon: "\uF1DB"
  - name: ThermoExt2
    title: Schafzimmerthermostat
    type: cardThermo2
    min: 5.0
    max: 30.0
    steps: 0.5
    details: True
    slots:
      - class: ohItem
        type: number
        item: H_Schlafzimmer_SetHeatTemp
      - class: ohItem
        type: text
        item: H_Schlafzimmer_Temperatur
      - class: ohItem
        type: text
        item: H_Schlafzimmer_Humid
      - class: ohItem
        type: text
        item: H_Schlafzimmer_RunState

      - class: ohItem
        type: button
        item: H_Schlafzimmer_SysMode
        radioButtonState: "Off"
        iconColor: default=green,Off=red
      - class: ohItem
        type: button
        item: H_Schlafzimmer_SysMode
        radioButtonState: "Heat"
        iconColor: default=grey,Heat=red
      - class: ohItem
        type: button
        item: H_Schlafzimmer_SysMode
        radioButtonState: "Cool"
        iconColor: default=grey,Cool=blue
      - class: ohItem
        type: button
        item: H_Schlafzimmer_SysMode
        radioButtonState: "Auto"
        iconColor: default=grey,Auto=white

      - class: ohItem
        type: switch
        item: H_Schlafzimmer_Lock
        iconColor: ON=red,OFF=green
        icon: ON=lock,OFF=lock-open-variant
      - class: ohItem
        type: switch
        item: H_Schlafzimmer_boost
        iconColor: ON="red",OFF=grey
        icon: "\uFA44"
      - class: ohItem
        type: switch
        item: H_Schlafzimmer_windowOpen
        iconColor: ON=blue,OFF=grey
        icon: ON=window-open-variant,OFF=window-closed-variant
      - class:

      - class: ohItem
        type: input_sel
        item: H_Schlafzimmer_OpMode
        icon: dots-vertical-circle-outline
  - name: MyPowerChart
    title: Power consumption
    type: cardChart
    life: true
    period: 3d
    past: w
    slots:
      - class: ohItem
        type: number
        item: Stromzaehler_power
  - name: MySwitchChart
    title: Lampe
    type: cardChart
    life: true
    period: 4d
    #past: w
    slots:
      - class: ohItem
        type: input_sel
        item: YamahaInput
  - name: YamahaPlayer
    title: Yamaha Receiver
    type: cardMedia
    slots:
      - class: ohItem
        type: player
        item: YamahaControl
        volumeItem: YamahaVolume
        powerItem: YamahaPower
        shuffleItem: YamahaShuffle
        shuffleIcon: Off=shuffle-disabled,Songs=shuffle,Album=shuffle-variant
        line1Item: YamahaStation
        line2Item: YamahaTitle
        line1Color: red
        line2Color: green
      - class: ohItem
        type: input_sel
        icon: menu
        item: YamahaInput
      - class: ohItem
        type: switch
        icon: OFF=volume-low,ON=volume-variant-off
        iconColor: ON=red,OFF=white
        item: YamahaMute
      - class: ohItem
        type: input_sel
        icon: radio
        iconColor: green
        item: YamahaPreset
      - class: ohItem
        type: input_sel
        icon: surround-sound
        iconColor: yellow
        item: YamahaSurround
      - class: ohItem
        type: input_sel
        icon: sleep
        iconColor: yellow
        item: YamahaSleep
      - class: ohItem
        type: button
        icon: Off=repeat-off,One=repeat-once,All=repeat
        iconColor: blue
        item: YamahaRepeat


