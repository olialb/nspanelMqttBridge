        iconColor: pink
        text: Test cards
        navTo: test/.
      - class: ohItem
        type: light
        text: Gruppe
        #icon: \uefa2a #blinds-horizontal
        item: Switch_Wintergarten
        #tiltItem: Dimmer_Flurdecke
