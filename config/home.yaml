#
# Home cards
#
cards:
  - name: Flur
    title: Flur
    type: cardGrid
    slots:
      - class: ohItem
        type: light
        text: Deckenlampe
        icon: track-light
        item: Switch_Flurdecke
        dimmerItem: Dimmer_Flurdecke
      - class: ohItem
        type: shutter
        text: Rolladen
        #icon: \uefa2a #blinds-horizontal
        item: R_RolladenWintergarten
        #tiltItem: Dimmer_Flurdecke
